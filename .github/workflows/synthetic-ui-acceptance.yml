name: Synthetic converter browser acceptance

on:
  push:
    branches:
      - portfolio/parts-data-quality-case-study-20261112
    paths:
      - "scripts/synthetic_ui_acceptance.py"
      - ".github/workflows/synthetic-ui-acceptance.yml"
      - "streamlit_app.py"
      - "parser.py"
      - "tests/**"
  pull_request:
    paths:
      - "scripts/synthetic_ui_acceptance.py"
      - ".github/workflows/synthetic-ui-acceptance.yml"
      - "streamlit_app.py"
      - "parser.py"
      - "storage.py"
      - "ai_review.py"
      - "tests/synthetic_catalog_fixture.py"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  synthetic-browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install app and browser test dependencies
        run: python -m pip install -r requirements.txt playwright
      - name: Install Chromium
        run: python -m playwright install chromium --with-deps
      - name: Launch app and confirm it responds locally
        run: |
          python -m streamlit run streamlit_app.py --server.headless=true --server.address=127.0.0.1 --server.port=8501 > "$RUNNER_TEMP/streamlit.log" 2>&1 &
          python - <<'PY'
          import time
          from urllib.request import urlopen
          for attempt in range(45):
              try:
                  with urlopen("http://127.0.0.1:8501/_stcore/health", timeout=3) as response:
                      if response.status == 200:
                          print("Streamlit ready on local CI runner")
                          break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("Streamlit did not start")
          PY
      - name: Test invented-data browser upload and Excel export
        run: python -m scripts.synthetic_ui_acceptance
      - name: Preserve invented-data screenshots only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-browser-screenshots
          path: artifacts/synthetic-ui/
          if-no-files-found: ignore
          retention-days: 7

      - name: Package public source only for private local catalog testing
        if: success()
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile
          paths = ["README.md", "parser.py", "streamlit_app.py", "storage.py", "ai_review.py",
                   "requirements.txt", "runtime.txt"]
          paths += sorted(str(p) for d in ("scripts", "tests")
                          for p in Path(d).rglob("*.py") if p.is_file())
          Path("artifacts").mkdir(exist_ok=True)
          with ZipFile("artifacts/converter-source-only.zip", "w", ZIP_DEFLATED) as z:
              for path in paths:
                  z.write(path, arcname=path)
          print("Source-only bundle paths:", ", ".join(paths))
          PY
      - name: Retain source-only package without supplier data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: source-only-private-test-bundle
          path: artifacts/converter-source-only.zip
          retention-days: 1
